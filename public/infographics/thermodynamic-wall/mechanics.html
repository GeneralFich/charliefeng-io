<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infographic</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "Inter", sans-serif; background: transparent;
               -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
               overflow: hidden; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        .chart-container { position: relative; width: 100%; max-width: 800px;
                           margin-left: auto; margin-right: auto; height: 400px; max-height: 500px; }
        @media (max-width: 768px) { .chart-container { height: 300px; } }
        .bg-slate-900\/50 { background-color: rgba(15, 23, 42, 0.5); }
        .p-4 { padding: 1rem; }
        .rounded-2xl { border-radius: 1rem; }
        .shadow-lg { box-shadow: 0 10px 15px -3px rgba(0,0,0,.1), 0 4px 6px -4px rgba(0,0,0,.1); }
        .border { border-width: 1px; border-style: solid; }
        .border-slate-800 { border-color: #1e293b; }
        .backdrop-blur-sm { backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
        .mb-2 { margin-bottom: 0.5rem; }
        .flex { display: flex; }
        .justify-between { justify-content: space-between; }
        .items-end { align-items: flex-end; }
        .font-bold { font-weight: 700; }
        .text-white { color: #ffffff; }
        .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
        .text-xs { font-size: 0.75rem; line-height: 1rem; }
        .text-slate-300 { color: #cbd5e1; }
        .bg-slate-800 { background-color: #1e293b; }
        .px-2 { padding-left: 0.5rem; padding-right: 0.5rem; }
        .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
        .rounded { border-radius: 0.25rem; }
        .border-slate-700 { border-color: #334155; }
    </style>
</head>
<body class="antialiased overflow-hidden">
    <div class="bg-slate-900/50 p-4 rounded-2xl shadow-lg border border-slate-800 backdrop-blur-sm">
        <div class="mb-2 flex justify-between items-end">
            <h3 class="font-bold text-white text-sm">Global AI Energy Consumption (Index)</h3>
            <span class="text-xs text-slate-300 bg-slate-800 px-2 py-1 rounded border border-slate-700">2024-2030</span>
        </div>
        <div class="chart-container" style="height: 300px;">
            <canvas id="mechanicsChart"></canvas>
        </div>
    </div>
    <script>
        Chart.defaults.font.family = "'Inter', sans-serif";
        Chart.defaults.color = '#94a3b8';
        Chart.defaults.borderColor = '#334155';
        Chart.defaults.maintainAspectRatio = false;

        const ctx = document.getElementById('mechanicsChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['2024', '2025', '2026', '2027', '2028', '2029', '2030'],
                datasets: [
                    {
                        label: 'Model Training',
                        data: [40, 45, 48, 50, 52, 54, 55],
                        backgroundColor: 'rgba(245, 158, 11, 0.2)',
                        borderColor: '#F59E0B',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointBackgroundColor: '#F59E0B',
                        pointBorderColor: '#fff'
                    },
                    {
                        label: 'Inference Load',
                        data: [10, 20, 35, 55, 80, 110, 150],
                        backgroundColor: 'rgba(37, 99, 235, 0.2)',
                        borderColor: '#3B82F6',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointBackgroundColor: '#3B82F6',
                        pointBorderColor: '#fff'
                    }
                ]
            },
            options: {
                plugins: {
                    legend: {
                        position: 'top',
                        labels: {
                            boxWidth: 10,
                            font: { size: 10 },
                            color: '#e2e8f0'
                        }
                    },
                    tooltip: {
                        backgroundColor: 'rgba(15, 23, 42, 0.9)',
                        titleColor: '#f8fafc',
                        bodyColor: '#cbd5e1',
                        borderColor: '#334155',
                        borderWidth: 1
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: { borderDash: [5, 5], color: '#334155' },
                        ticks: { display: false }
                    },
                    x: {
                        grid: { display: false },
                        ticks: { font: { size: 10 }, color: '#94a3b8' }
                    }
                }
            }
        });
    </script>
</body></html>
