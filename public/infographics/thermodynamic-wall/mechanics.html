<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infographic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: "Inter", sans-serif; background: transparent; }
        .chart-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            height: 400px;
            max-height: 500px;
        }
        @media (max-width: 768px) {
            .chart-container { height: 300px; }
        }
        .gradient-text {
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            background-image: linear-gradient(135deg, #2563EB, #06B6D4);
        }
        /* Hide scrollbars if possible */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="antialiased overflow-hidden">
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
        <div class="mb-2 flex justify-between items-end">
            <h3 class="font-bold text-slate-800 text-sm">Global AI Energy Consumption (Index)</h3>
            <span class="text-xs text-slate-400 bg-slate-100 px-2 py-1 rounded">2024-2030</span>
        </div>
        <div class="chart-container" style="height: 300px;">
            <canvas id="mechanicsChart"></canvas>
        </div>
    </div>
    <script>
        Chart.defaults.font.family = "'Inter', sans-serif";
        Chart.defaults.color = '#64748b';
        Chart.defaults.maintainAspectRatio = false;

        const ctx = document.getElementById('mechanicsChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['2024', '2025', '2026', '2027', '2028', '2029', '2030'],
                datasets: [
                    {
                        label: 'Model Training',
                        data: [40, 45, 48, 50, 52, 54, 55],
                        backgroundColor: 'rgba(245, 158, 11, 0.2)',
                        borderColor: '#F59E0B',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4
                    },
                    {
                        label: 'Inference Load',
                        data: [10, 20, 35, 55, 80, 110, 150],
                        backgroundColor: 'rgba(37, 99, 235, 0.2)',
                        borderColor: '#2563EB',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4
                    }
                ]
            },
            options: {
                plugins: { legend: { position: 'top', labels: { boxWidth: 10, font: { size: 10 } } } },
                scales: {
                    y: { beginAtZero: true, grid: { borderDash: [5, 5] }, ticks: { display: false } },
                    x: { grid: { display: false }, ticks: { font: { size: 10 } } }
                }
            }
        });
    </script>
</body></html>
