<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infographic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: "Inter", sans-serif; background: transparent; }
        .chart-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            height: 400px;
            max-height: 500px;
        }
        @media (max-width: 768px) {
            .chart-container { height: 300px; }
        }
        .gradient-text {
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            background-image: linear-gradient(135deg, #2563EB, #06B6D4);
        }
        /* Hide scrollbars if possible */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="antialiased overflow-hidden">
    <div class="bg-slate-900/50 rounded-2xl p-4 border border-slate-800 backdrop-blur-sm shadow-lg">
        <h3 class="text-sm font-semibold text-slate-400 uppercase mb-4 text-center">Strategic Profile Comparison</h3>
        <div class="chart-container" style="height: 300px;">
            <canvas id="strategyChart"></canvas>
        </div>
    </div>
    <script>
        Chart.defaults.font.family = "'Inter', sans-serif";
        Chart.defaults.maintainAspectRatio = false;
        Chart.defaults.color = '#94a3b8';
        Chart.defaults.borderColor = '#334155';

        function formatLabel(str) {
            if (str.length <= 16) return str;
            const words = str.split(' ');
            return [words[0], words.slice(1).join(' ')];
        }

        const ctx = document.getElementById('strategyChart').getContext('2d');
        const rawRadarLabels = ['Density', 'Speed to Deploy', 'Energy Efficiency', 'CapEx Efficiency', 'Grid Independence'];
        const radarLabels = rawRadarLabels.map(l => formatLabel(l));

        new Chart(ctx, {
            type: 'radar',
            data: {
                labels: radarLabels,
                datasets: [{
                    label: 'Green Compute',
                    data: [90, 85, 95, 75, 60],
                    fill: true,
                    backgroundColor: 'rgba(59, 130, 246, 0.2)',
                    borderColor: '#3B82F6',
                    pointBackgroundColor: '#3B82F6',
                    pointBorderColor: '#fff'
                }, {
                    label: 'Status Quo',
                    data: [40, 30, 50, 60, 20],
                    fill: true,
                    backgroundColor: 'rgba(148, 163, 184, 0.2)',
                    borderColor: '#94a3b8',
                    pointBackgroundColor: '#94a3b8',
                    pointBorderColor: '#fff'
                }]
            },
            options: {
                plugins: {
                    legend: { labels: { color: '#e2e8f0', font: { size: 10 } } },
                    tooltip: {
                        backgroundColor: 'rgba(15, 23, 42, 0.9)',
                        titleColor: '#f8fafc',
                        bodyColor: '#cbd5e1',
                        borderColor: '#334155',
                        borderWidth: 1
                    }
                },
                scales: {
                    r: {
                        angleLines: { color: '#334155' },
                        grid: { color: '#334155' },
                        pointLabels: { color: '#e2e8f0', font: { size: 9, weight: '600' } },
                        ticks: { display: false, backdropColor: 'transparent' }
                    }
                }
            }
        });
    </script>
</body></html>
