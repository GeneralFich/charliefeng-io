<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infographic</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "Inter", sans-serif; background: transparent;
               -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
               overflow: hidden; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        .chart-container { position: relative; width: 100%; max-width: 800px;
                           margin-left: auto; margin-right: auto; height: 400px; max-height: 500px; }
        @media (max-width: 768px) { .chart-container { height: 300px; } }
        .bg-slate-900\/50 { background-color: rgba(15, 23, 42, 0.5); }
        .rounded-2xl { border-radius: 1rem; }
        .shadow-lg { box-shadow: 0 10px 15px -3px rgba(0,0,0,.1), 0 4px 6px -4px rgba(0,0,0,.1); }
        .border { border-width: 1px; border-style: solid; }
        .border-slate-800 { border-color: #1e293b; }
        .p-4 { padding: 1rem; }
        .backdrop-blur-sm { backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
        .font-bold { font-weight: 700; }
        .text-white { color: #ffffff; }
        .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
        .mb-4 { margin-bottom: 1rem; }
        .text-center { text-align: center; }
    </style>
</head>
<body class="antialiased overflow-hidden">
    <div class="bg-slate-900/50 rounded-2xl shadow-lg border border-slate-800 p-4 backdrop-blur-sm">
        <h3 class="font-bold text-white text-sm mb-4 text-center">Innovation Velocity Map</h3>
        <div class="chart-container" style="height: 350px;">
            <canvas id="leverageChart"></canvas>
        </div>
    </div>
    <script>
        Chart.defaults.font.family = "'Inter', sans-serif";
        Chart.defaults.maintainAspectRatio = false;
        Chart.defaults.color = '#94a3b8';
        Chart.defaults.borderColor = '#334155';

        const ctx = document.getElementById('leverageChart').getContext('2d');

        const rawData = [
            { x: 1, y: 9, r: 20, label: 'Liquid Cooling' },
            { x: 2, y: 7, r: 12, label: 'Software Power Mgmt' },
            { x: 8, y: 10, r: 25, label: 'SMRs (Nuclear)' },
            { x: 6, y: 3, r: 8, label: 'Grid Expansion' },
            { x: 3, y: 8, r: 10, label: 'Immersion Tanks' },
            { x: 2, y: 5, r: 6, label: 'Optical Interconnect' }
        ];

        new Chart(ctx, {
            type: 'bubble',
            data: {
                datasets: [{
                    label: 'Innovations',
                    data: rawData,
                    backgroundColor: (ctx) => {
                        const v = ctx.raw;
                        if (!v) return '#475569';
                        if (v.x < 4 && v.y > 6) return 'rgba(59, 130, 246, 0.8)'; // blue-500
                        if (v.x > 5) return 'rgba(245, 158, 11, 0.8)'; // amber-500
                        if (v.label.includes('Software')) return 'rgba(16, 185, 129, 0.8)'; // emerald-500
                        return 'rgba(148, 163, 184, 0.8)'; // slate-400
                    },
                    borderColor: 'rgba(255, 255, 255, 0.1)',
                    borderWidth: 1
                }]
            },
            options: {
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: 'rgba(15, 23, 42, 0.9)',
                        titleColor: '#f8fafc',
                        bodyColor: '#cbd5e1',
                        borderColor: '#334155',
                        borderWidth: 1,
                        callbacks: {
                            title: (items) => items[0].raw.label,
                            label: (ctx) => `Deploy: ${ctx.raw.x} yrs | Impact: ${ctx.raw.y}/10`
                        }
                    }
                },
                scales: {
                    x: {
                        title: { display: true, text: 'Time to Deployment (Years)', font: { size: 10, weight: 'bold' }, color: '#94a3b8' },
                        min: 0, max: 10,
                        grid: { display: false, color: '#334155' },
                        ticks: { color: '#94a3b8' }
                    },
                    y: {
                        title: { display: true, text: 'Impact on Density', font: { size: 10, weight: 'bold' }, color: '#94a3b8' },
                        min: 0, max: 12,
                        grid: { color: '#334155' },
                        ticks: { color: '#94a3b8' }
                    }
                }
            }
        });
    </script>
</body></html>
