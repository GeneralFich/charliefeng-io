<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; color: #0F172A; padding: 1rem; }
    </style>
</head>
<body class="bg-slate-50">
    <div class="bg-slate-200 p-8 rounded-xl shadow-inner max-w-4xl mx-auto">
        <div class="grid grid-cols-3 gap-4 text-center">
            <!-- Hardware Side -->
            <div class="flex flex-col space-y-4">
                <div class="bg-slate-800 text-white p-4 rounded shadow-lg transform transition hover:scale-105">
                    <div class="text-2xl">⚡</div>
                    <div class="font-bold">Power</div>
                </div>
                <div class="bg-slate-800 text-white p-4 rounded shadow-lg transform transition hover:scale-105">
                    <div class="text-2xl">🧊</div>
                    <div class="font-bold">Thermal</div>
                </div>
                <div class="bg-slate-800 text-white p-4 rounded shadow-lg transform transition hover:scale-105">
                    <div class="text-2xl">🕸️</div>
                    <div class="font-bold">Fabric</div>
                </div>
            </div>

            <!-- The Bridge -->
            <div class="flex flex-col justify-center items-center">
                <div class="text-4xl text-slate-400 mb-2">➜</div>
                <div class="bg-indigo-600 text-white py-6 px-2 rounded-lg shadow-2xl w-full z-10 border-4 border-white">
                    <div class="text-3xl mb-2">⚖️</div>
                    <div class="font-extrabold text-sm uppercase">Infra Product Leader</div>
                </div>
                <div class="text-4xl text-slate-400 mt-2">➜</div>
            </div>

            <!-- Software Side -->
            <div class="flex flex-col space-y-4">
                <div class="bg-sky-600 text-white p-4 rounded shadow-lg transform transition hover:scale-105">
                    <div class="text-2xl">🧠</div>
                    <div class="font-bold">Kernels</div>
                </div>
                <div class="bg-sky-600 text-white p-4 rounded shadow-lg transform transition hover:scale-105">
                    <div class="text-2xl">📦</div>
                    <div class="font-bold">Checkpoint</div>
                </div>
                <div class="bg-sky-600 text-white p-4 rounded shadow-lg transform transition hover:scale-105">
                    <div class="text-2xl">⏱️</div>
                    <div class="font-bold">Latency</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
