    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <!-- Prevent flash of wrong theme: apply persisted preference before first paint -->
    <script>
      ;(function() {
        var saved = localStorage.getItem('app_theme');
        var mode = (saved === 'light' || saved === 'dark' || saved === 'system') ? saved : 'system';
        var dark;
        if (mode === 'system') {
          dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        } else {
          dark = mode === 'dark';
        }
        if (dark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-200 antialiased selection:bg-blue-500/20 dark:selection:bg-blue-500/30 selection:text-blue-800 dark:selection:text-blue-200">
