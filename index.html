<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://fonts.googleapis.com; connect-src 'self' https://generativelanguage.googleapis.com https://*.googleapis.com; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com;">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Charlie Feng | Infrastructure Product Leader</title>
    <meta name="description" content="AI-powered portfolio of Charlie Feng, an Infrastructure Product Leader exploring Product Management, AGI, and Infrastructure." />
    <meta property="og:title" content="Charlie Feng | Infrastructure Product Leader" />
    <meta property="og:description" content="AI-powered portfolio of Charlie Feng, an Infrastructure Product Leader exploring Product Management, AGI, and Infrastructure." />
    <meta property="og:type" content="website" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
      }
      // Prevent flash of wrong theme: apply persisted preference before first paint
      ;(function() {
        var saved = localStorage.getItem('app_theme');
        var mode = (saved === 'light' || saved === 'dark' || saved === 'system') ? saved : 'system';
        var dark;
        if (mode === 'system') {
          dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        } else {
          dark = mode === 'dark';
        }
        if (dark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <style>
      /* Fallback for Chinese Characters */
      :lang(zh) {
        font-family: "Noto Sans SC", sans-serif !important;
      }

      @media print {
        body {
          background-color: white !important;
          color: black !important;
        }

        /* Ensure Chinese font is used in print if language is zh */
        :lang(zh) body {
            font-family: "Noto Sans SC", sans-serif !important;
        }

        * {
          color: black !important;
          background-color: transparent !important;
          text-shadow: none !important;
          box-shadow: none !important;
        }
      }

      /* Custom Scrollbar — theme-aware */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      .dark ::-webkit-scrollbar-track,
      .dark::-webkit-scrollbar-track {
        background: #0f172a;
      }
      .dark ::-webkit-scrollbar-thumb,
      .dark::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
      }
      .dark ::-webkit-scrollbar-thumb:hover,
      .dark::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      /* ── Animation Keyframes ─────────────────────────────── */

      /* Three-dot bouncing loader — each dot uses a staggered delay */
      @keyframes bounce-dot {
        0%, 70%, 100% { transform: translateY(0);   opacity: 0.35; }
        35%            { transform: translateY(-8px); opacity: 1;    }
      }

      /* Shimmer sweep for the scroll-progress bar */
      @keyframes shimmer-sweep {
        0%   { transform: translateX(-200%); }
        100% { transform: translateX(400%);  }
      }

      /* Gradient background-position shift for the progress bar */
      @keyframes grad-shift {
        0%   { background-position: 0%   50%; }
        50%  { background-position: 100% 50%; }
        100% { background-position: 0%   50%; }
      }

      /* Respect user's reduced-motion preference */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-200 antialiased selection:bg-blue-500/20 dark:selection:bg-blue-500/30 selection:text-blue-800 dark:selection:text-blue-200">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
